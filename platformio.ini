; Victron BLE Vehicle Monitor — see PROJECT_PLAN.md
;
; Envs:
;   wroom   - Phase 1/2 dev firmware on the ESP32 WROOM-32 (BLE decrypt -> Serial)
;   master  - Guition JC3248W535 (ESP32-S3) display firmware
;   slave   - LilyGo T-Display-S3 firmware
;   native  - host unit tests for lib/victron (pio test -e native)

[platformio]
default_envs = wroom

[env]
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
monitor_speed = 115200

[esp_common]
platform = espressif32
framework = arduino

[env:wroom]
extends = esp_common
board = esp32dev
build_src_filter = +<wroom/>
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2

; M5Stack AtomS3 Lite (ESP32-S3, native USB -> /dev/ttyACM0).
; Headless-master dev target: builds the master firmware (BLE scan + WiFi AP +
; HTTP API) minus the LVGL display.
[env:atoms3]
extends = esp_common
board = m5stack-atoms3
build_src_filter = +<master/>
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    https://github.com/ESP32Async/AsyncTCP
    https://github.com/ESP32Async/ESPAsyncWebServer

[env:master]
extends = esp_common
board = esp32-s3-devkitc-1   ; placeholder until JC3248W535 board def is wired up
build_src_filter = +<master/>
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    https://github.com/ESP32Async/AsyncTCP
    https://github.com/ESP32Async/ESPAsyncWebServer
    lvgl/lvgl@^9.2.0

[env:slave]
extends = esp_common
board = esp32-s3-devkitc-1   ; placeholder for LilyGo T-Display-S3
build_src_filter = +<slave/>
lib_deps =
    lvgl/lvgl@^9.2.0

[env:native]
platform = native
test_framework = unity
