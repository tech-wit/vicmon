; Victron BLE Vehicle Monitor — see PROJECT_PLAN.md
;
; ONE app (src/master/) runs on every board; the display DRIVER is chosen at build
; time per board, the master/slave ROLE at runtime (NVS flag). Board envs:
;   master   - Guition JC3248W535 (BOARD_GUITION, AXS15231B display) — master or slave
;   headless - bare ESP32-S3 / AtomS3 (no display) — master or slave
;   lilygo   - LilyGo T-Display-S3 (BOARD_LILYGO; display driver TBD, builds headless)
;   atoms3   - M5Stack AtomS3 dev target (headless master, littlefs)
; Bench/reference: guition (dashboard demo), gfxref, lvglref. wroom = Phase-1 scanner.
;   native   - host unit tests (pio test -e native)

[platformio]
default_envs = wroom

[env]
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
monitor_speed = 115200

[esp_common]
platform = espressif32
framework = arduino

[env:wroom]
extends = esp_common
board = esp32dev
build_src_filter = +<wroom/>
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2

; M5Stack AtomS3 Lite (ESP32-S3, native USB -> /dev/ttyACM0).
; Headless-master dev target: builds the master firmware (BLE scan + WiFi AP +
; HTTP API) minus the LVGL display.
[env:atoms3]
extends = esp_common
board = m5stack-atoms3
build_src_filter = +<master/>
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv  ; carve out a ~1.5MB FS for history persistence
; Headless build: the display lib is only for the Guition master env. LDF doesn't
; evaluate the #ifdef VICMON_DISPLAY guard on its include, so exclude it here.
lib_ignore = guition
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    https://github.com/ESP32Async/AsyncTCP
    https://github.com/ESP32Async/ESPAsyncWebServer
    bblanchon/ArduinoJson@^7.0.0

; Same as atoms3 but with synthetic device data (no Victron device needed):
; develop/demo the full web UI, charts, stats and alerts on the bench.
[env:atoms3-sim]
extends = env:atoms3
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D VICMON_SIM=1

; Guition JC3248W535 standalone dashboard demo — Arduino_GFX dashboard with
; synthetic data, no BLE/WiFi. ESP32-S3-WROOM-1 N16R8: 16MB flash, 8MB OPI PSRAM.
[env:guition]
extends = esp_common
board = esp32-s3-devkitc-1
build_src_filter = +<guition/>
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi   ; QIO flash + OPI (octal) PSRAM (N16R8)
build_flags =
    ${env.build_flags}
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ; 1.5.9 = newest with the AXS15231B QSPI driver but no esp32-hal-periman.h
    ; dependency (that arrived in 1.6.x, which needs arduino-esp32 3.x; we're on 2.0.17)
    moononournation/GFX Library for Arduino@~1.5.9

; Real master firmware on the Guition JC3248W535: the headless master (BLE scan +
; WiFi AP + web app + aggregator, src/master/) PLUS the Arduino_GFX dashboard on
; the AXS15231B panel (lib/guition/). ESP32-S3 N16R8: 16MB flash, 8MB OPI PSRAM.
; Reference baseline: me-processware JC3248W535 driver + its Basic example (portrait).
[env:gfxref]
extends = esp_common
board = esp32-s3-devkitc-1
build_src_filter = +<gfxref/>
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    https://github.com/me-processware/JC3248W535-Driver
    moononournation/GFX Library for Arduino@~1.5.9

; LVGL v9 demo on the real Guition panel: the stock GFX LVGL example adapted onto
; lib/guition's known-good canvas + touch. Standalone (no BLE/WiFi) so we can see
; whether LVGL renders cleanly on this AXS15231B canvas. lv_conf.h in src/lvglref/.
[env:lvglref]
extends = esp_common
board = esp32-s3-devkitc-1
build_src_filter = +<lvglref/>
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D LV_CONF_INCLUDE_SIMPLE
    -I src/lvglref
lib_deps =
    moononournation/GFX Library for Arduino@~1.5.9
    lvgl/lvgl@^9.2.0

; Guition JC3248W535 build of the ONE app (src/master), BOARD_GUITION selects the
; AXS15231B display driver (lib/guition). Runs as master OR slave at runtime (NVS
; role flag) — as a slave it renders the received data on the panel. N16R8: 16MB
; flash / 8MB OPI PSRAM.
[env:master]
extends = esp_common
board = esp32-s3-devkitc-1
build_src_filter = +<master/>
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv   ; 2 app slots (OTA) + FS for history
build_flags =
    ${env.build_flags}
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_GUITION=1
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    https://github.com/ESP32Async/AsyncTCP
    https://github.com/ESP32Async/ESPAsyncWebServer
    bblanchon/ArduinoJson@^7.0.0
    moononournation/GFX Library for Arduino@~1.5.9

; Headless dual-role build of the ONE app (src/master): bare ESP32-S3 (8MB, no
; PSRAM, no display). Runs as master OR slave chosen at runtime (NVS role flag) —
; master = BLE scan + AP + web + broadcast; slave = ESP-NOW receiver + config AP.
; No board flag => no display driver compiled.
[env:headless]
extends = esp_common
board = esp32-s3-devkitc-1
build_src_filter = +<master/>
board_upload.flash_size = 8MB
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv
lib_ignore = guition   ; display lib is only for a display board; LDF can't see the #ifdef
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    https://github.com/ESP32Async/AsyncTCP
    https://github.com/ESP32Async/ESPAsyncWebServer
    bblanchon/ArduinoJson@^7.0.0

; LilyGo T-Display-S3 build of the ONE app (src/master), BOARD_LILYGO. The ST7789
; display + 2-button driver isn't written yet, so today this builds HEADLESS on the
; LilyGo (full master/slave over serial/AP); wire the display driver when the board
; is in hand, then it renders like the Guition. N16R8 (16MB flash / 8MB PSRAM).
[env:lilygo]
extends = esp_common
board = esp32-s3-devkitc-1   ; LilyGo T-Display-S3 (generic S3 profile until a board file is added)
build_src_filter = +<master/>
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv
lib_ignore = guition
build_flags =
    ${env.build_flags}
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_LILYGO=1
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    https://github.com/ESP32Async/AsyncTCP
    https://github.com/ESP32Async/ESPAsyncWebServer
    bblanchon/ArduinoJson@^7.0.0

[env:native]
platform = native
test_framework = unity
