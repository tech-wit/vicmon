; Victron BLE Vehicle Monitor — see PROJECT_PLAN.md
;
; ONE app (src/master/) runs on every board; the master/slave ROLE is chosen at
; runtime (NVS flag). One UNIVERSAL image now covers every ESP32-S3 board:
;   s3         - universal image for ALL ESP32-S3 boards (Guition, AtomS3, bare S3).
;                The display + OPI PSRAM are compiled in and used only where the
;                hardware is present; any other S3 runs headless. The default env —
;                flash any board with:  pio run -e s3 -t upload --upload-port <port>
;   atoms3-sim - the s3 image with synthetic data (no Victron hardware), for bench dev
; Bench/reference: guition (dashboard demo), gfxref, lvglref. wroom = Phase-1 scanner
; (classic ESP32, src/wroom). native = host unit tests (pio test -e native).

[platformio]
default_envs = s3

[env]
; Keep the builder's absolute paths out of the shipped binary: the Arduino core is
; compiled from source here, and its assert/log __FILE__ strings would otherwise
; embed /home/<user>/.platformio/... in every image we publish. Maps both the
; package tree and the project dir to short, stable stand-ins.
build_flags = -std=gnu++17
    -ffile-prefix-map=${platformio.packages_dir}=/pkg
    -ffile-prefix-map=${platformio.workspace_dir}=/build
    -ffile-prefix-map=${platformio.core_dir}=/pio
    -ffile-prefix-map=${PROJECT_DIR}=/vicmon
build_unflags = -std=gnu++11
monitor_speed = 115200

[esp_common]
platform = espressif32
framework = arduino

[env:wroom]
extends = esp_common
board = esp32dev
build_src_filter = +<wroom/>
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2

; Synthetic device data (no Victron device needed): develop/demo the full web UI,
; charts, stats and alerts on the bench with no hardware. Rides on the universal
; s3 image — runs the dashboard on a Guition, headless on any other S3.
[env:atoms3-sim]
extends = env:s3
build_flags =
    ${env.build_flags}
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_GUITION=1
    -D VICMON_SIM=1

; Guition JC3248W535 standalone dashboard demo — Arduino_GFX dashboard with
; synthetic data, no BLE/WiFi. ESP32-S3-WROOM-1 N16R8: 16MB flash, 8MB OPI PSRAM.
[env:guition]
extends = esp_common
board = esp32-s3-devkitc-1
build_src_filter = +<guition/>
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi   ; QIO flash + OPI (octal) PSRAM (N16R8)
build_flags =
    ${env.build_flags}
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ; 1.5.9 = newest with the AXS15231B QSPI driver but no esp32-hal-periman.h
    ; dependency (that arrived in 1.6.x, which needs arduino-esp32 3.x; we're on 2.0.17)
    moononournation/GFX Library for Arduino@~1.5.9

; Real master firmware on the Guition JC3248W535: the headless master (BLE scan +
; WiFi AP + web app + aggregator, src/master/) PLUS the Arduino_GFX dashboard on
; the AXS15231B panel (lib/guition/). ESP32-S3 N16R8: 16MB flash, 8MB OPI PSRAM.
; Reference baseline: me-processware JC3248W535 driver + its Basic example (portrait).
[env:gfxref]
extends = esp_common
board = esp32-s3-devkitc-1
build_src_filter = +<gfxref/>
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    https://github.com/me-processware/JC3248W535-Driver
    moononournation/GFX Library for Arduino@~1.5.9

; LVGL v9 demo on the real Guition panel: the stock GFX LVGL example adapted onto
; lib/guition's known-good canvas + touch. Standalone (no BLE/WiFi) so we can see
; whether LVGL renders cleanly on this AXS15231B canvas. lv_conf.h in src/lvglref/.
[env:lvglref]
extends = esp_common
board = esp32-s3-devkitc-1
build_src_filter = +<lvglref/>
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D LV_CONF_INCLUDE_SIMPLE
    -I src/lvglref
lib_deps =
    moononournation/GFX Library for Arduino@~1.5.9
    lvgl/lvgl@^9.2.0

; LilyGo T-Display-S3 (buttons) panel bring-up — standalone ST7789 320x170 test
; sketch (src/lilygoref/), the LilyGo counterpart to gfxref. Proves panel +
; backlight + buttons before the driver is folded into the master app behind
; BOARD_LILYGO. ESP32-S3 N16R8: 16MB flash, 8MB OPI PSRAM, native-USB CDC serial.
[env:lilygoref]
extends = esp_common
board = esp32-s3-devkitc-1
build_src_filter = +<lilygoref/>
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    moononournation/GFX Library for Arduino@~1.5.9

; UNIVERSAL S3 image — ONE artifact for every ESP32-S3 board (Guition, AtomS3,
; bare S3). OPI PSRAM + the AXS15231B display driver are compiled in and used only
; where the hardware is present: a board with PSRAM brings up the panel, any other
; S3 detects no PSRAM and runs headless (the OPI-PSRAM boot init bails out
; gracefully — verified on the no-PSRAM AtomS3). Built on the 8MB partition (the
; lowest common denominator) so the image fits every S3; a 16MB board simply uses
; its first 8MB. NVS (device config / keys / pairing) sits at a fixed offset shared
; by the 8MB and 16MB partition tables, so it survives re-provisioning; only the
; LittleFS history region differs and re-forms on first boot.
;
; Flash any S3 board with:  pio run -e s3 -t upload --upload-port <port>
[env:s3]
extends = esp_common
board = esp32-s3-devkitc-1
build_src_filter = +<master/>
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv
build_flags =
    ${env.build_flags}
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Compile BOTH display backends into the one universal image; detectBoard()
    ; picks Guition (AXS15231B) vs LilyGo (ST7789) at boot. Keeps OTA-clone working
    ; across board types — a cloned image drives whichever panel it lands on.
    -D BOARD_GUITION=1
    -D BOARD_LILYGO=1
    ; M5Capsule (StampS3, headless): no panel, but positive-detected at boot via its
    ; BM8563 RTC and given peripheral support — RTC as the clock source (no NTP
    ; needed), buzzer low-battery alarm, microSD long-history CSV log, power-hold.
    -D BOARD_M5CAPSULE=1
    ; NimBLE trimmed for our SCAN-ONLY use (advertisement decryption, no GATT
    ; connections/advertising): frees heap otherwise reserved for connection contexts
    ; and the peripheral/broadcaster roles we never use. Verified BLE still decodes.
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D CONFIG_BT_NIMBLE_MAX_BONDS=1
    -D CONFIG_BT_NIMBLE_MAX_CCCDS=1
    -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    ; AsyncTCP task stack: the ESP32Async default is 16KB but ours measures <1KB used
    ; (pages build into heap, not stack) — trim to 10KB, freeing ~6KB heap while
    ; keeping a >9KB margin. `tasks` serial cmd re-checks the high-water under load.
    -D CONFIG_ASYNC_TCP_STACK_SIZE=10240
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    https://github.com/ESP32Async/AsyncTCP
    https://github.com/ESP32Async/ESPAsyncWebServer
    bblanchon/ArduinoJson@^7.0.0
    moononournation/GFX Library for Arduino@~1.5.9
    ; Bosch's own BME68x driver, for the Unit ENV Pro on the M5Capsule's Grove port.
    ; Vendor code (BSD-3) rather than a hand-rolled one: the BME688's temperature /
    ; pressure / humidity compensation is a long chain of calibration-coefficient
    ; polynomials that is easy to get subtly and silently wrong. NOT bsec2 — that is
    ; the closed-source IAQ blob; we log the raw gas resistance instead.
    boschsensortec/BME68x Sensor library@^1.3.40408

[env:native]
platform = native
test_framework = unity
